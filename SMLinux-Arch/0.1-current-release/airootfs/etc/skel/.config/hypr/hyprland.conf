# ─────────────────────────────────────────────
#  SMLinux · Hyprland configuration
#  Palette: ink #0E1420 · tangerine #FF7A3D · marigold #FFB347
#           coral #FF5E5B · mint #3DDBA8 · aqua #5EE6D0
# ─────────────────────────────────────────────

monitor = , preferred, auto, 1

# ── Environment ──
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# ── Autostart ──
exec-once = smlinux-wallpaper          # live wallpaper (falls back to the still SVG)
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = sleep 2 && notify-send -i smlinux "Welcome to SMLinux" "Super+Space opens apps · Super+Enter opens a terminal"

# ── Programs ──
$terminal = kitty
$files    = thunar
$browser  = firefox
$menu     = wofi --show drun

# ── Look ──
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(ff7a3dee) rgba(ffb347ee) rgba(3ddba8ee) 45deg
    col.inactive_border = rgba(ffffff1a)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 16
    active_opacity = 0.97
    inactive_opacity = 0.90

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        vibrancy = 0.25
        noise = 0.015
        popups = true
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(05080fcc)
    }
}

animations {
    enabled = true
    bezier = liquid,   0.22, 1.00, 0.36, 1.00
    bezier = glide,    0.05, 0.90, 0.10, 1.05
    bezier = soft,     0.40, 0.00, 0.20, 1.00

    animation = windows,     1, 6,  glide, popin 85%
    animation = windowsOut,  1, 5,  soft,  popin 85%
    animation = border,      1, 10, soft
    animation = borderangle, 1, 60, soft, loop
    animation = fade,        1, 6,  soft
    animation = layers,      1, 5,  liquid, slide
    animation = workspaces,  1, 6,  liquid, slidefade 15%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(0e1420)
}

cursor {
    # Helps in VirtualBox / QEMU where hardware cursors are often invisible.
    no_hardware_cursors = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── Keybinds ──
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, Space,  exec, $menu
bind = $mod, E,      exec, $files
bind = $mod, B,      exec, $browser
bind = $mod, I,      exec, smlinux-settings
bind = $mod, Escape, exec, smlinux-power
bind = $mod, K,      exec, smlinux-switch-desktop plasma
bind = $mod, W,      exec, smlinux-wallpaper toggle
bind = $mod, L,      exec, hyprlock
bind = $mod, Q,      killactive
bind = $mod, F,      fullscreen
bind = $mod, V,      togglefloating
bind = $mod, P,      pseudo
bind = $mod, J,      togglesplit
bind = $mod SHIFT, M, exit

bind = , Print,      exec, smlinux-screenshot area
bind = SHIFT, Print, exec, smlinux-screenshot full

# Focus / move
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

# Window & layer rules live in their own file because their syntax
# changes between Hyprland releases - fix them there if Hyprland complains.
source = ~/.config/hypr/rules.conf
