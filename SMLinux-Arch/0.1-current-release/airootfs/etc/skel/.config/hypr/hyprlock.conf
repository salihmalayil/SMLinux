# SMLinux lock screen
general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.2
}

label {
    monitor =
    text = $TIME
    color = rgba(f4f1eaff)
    font_size = 96
    font_family = Inter Display Bold
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(f4f1eacc)
    font_size = 20
    font_family = Inter
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    rounding = 18
    outline_thickness = 2
    outer_color = rgba(ff7a3dee) rgba(3ddba8ee) 45deg
    inner_color = rgba(0e1420aa)
    font_color = rgba(f4f1eaff)
    check_color = rgba(3ddba8ff)
    fail_color = rgba(ff5e5bff)
    placeholder_text = <i>Password</i>
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
