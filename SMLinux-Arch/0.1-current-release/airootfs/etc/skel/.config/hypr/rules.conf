# SMLinux window & layer rules.
# If Hyprland shows a red config-error bar after an update, the rule syntax here
# is the usual cause - see https://wiki.hypr.land/Configuring/Window-Rules/

# Frosted-glass blur behind the bar, dock, launcher and notifications
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, notifications
layerrule = ignorezero, notifications

# Small utility windows float, centred
windowrulev2 = float, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = size 900 600, class:^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager)$
windowrulev2 = center, floating:1
