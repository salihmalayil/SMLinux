# SMLinux login screen.
# Wayland greeter (KWin) - no X server is installed.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
# Only the two SMLinux sessions are listed
SessionDir=/usr/share/smlinux/wayland-sessions

[X11]
SessionDir=/usr/share/smlinux/xsessions

[Theme]
Current=breeze
CursorTheme=breeze_cursors

[Users]
MinimumUid=1000
MaximumUid=60000
