# SMLinux idle handling (hypridle still uses the classic config format).
# Not started on the live USB. Commands sent to Hyprland use the 0.57+ Lua syntax.
general {
    lock_cmd = smlinux-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 min: screen off
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspend, so laptops don't drain overnight
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
