<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- SMLinux boot-menu background (BIOS/syslinux). The menu is drawn over the
       middle, so the artwork stays at the top and bottom edges. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1628"/>
      <stop offset="1" stop-color="#0A111E"/>
    </linearGradient>
    <linearGradient id="s" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="0.4" stop-color="#FF7A3D"/>
      <stop offset="0.62" stop-color="#5EE6D0"/>
      <stop offset="1" stop-color="#3DDBA8"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19B38A"/>
      <stop offset="1" stop-color="#2A8FB8"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5E5B"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#sky)"/>
  <!-- logo + name, top -->
  <g transform="translate(232,22) scale(0.11)">
    <rect x="16" y="16" width="480" height="480" rx="124" fill="#16233A"/>
    <path d="M356,150 C312,112 176,112 172,204 C168,284 344,246 344,330 C344,414 200,412 154,362"
          fill="none" stroke="url(#s)" stroke-width="62" stroke-linecap="round"/>
  </g>
  <text x="300" y="52" font-family="sans-serif" font-size="24" font-weight="700" fill="#F4F1EA">SMLinux</text>
  <!-- liquid ribbons, bottom -->
  <path d="M0,418 C160,392 300,452 460,424 S600,396 640,404 L640,480 L0,480 Z" fill="url(#mint)" opacity="0.9"/>
  <path d="M0,446 C180,428 330,474 480,450 S610,436 640,440 L640,480 L0,480 Z" fill="url(#orange)" opacity="0.95"/>
  <path d="M0,466 C200,456 380,480 640,464 L640,480 L0,480 Z" fill="#0A111E"/>
</svg>
